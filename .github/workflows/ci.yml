name: CI

# Safety-net signal, not a merge gate: main deploys on push (see CLAUDE.md),
# so this does not block anything. It exists so a bad push is caught within
# minutes instead of at the next time someone happens to look.
#
# Runs with no secrets. Missing SUPABASE_URL/SUPABASE_SERVICE_KEY degrades to
# file-only by design (see utils/supabase_client.py, cron_state_store.py,
# health_ledger.py), and backend/conftest.py's autouse fixture keeps the
# suite off the real data/current tree regardless.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        # pytest is installed separately and deliberately not added to
        # requirements.txt: that file is also what a dev machine installs, and
        # requirements-vm.txt (production) must never carry a test runner.
        # Verified in a clean venv that requirements.txt + pytest is the whole
        # set the suite needs -- 796 passed.
        run: |
          pip install -r requirements.txt
          pip install "pytest>=9,<10"

      - name: Run backend test suite
        working-directory: backend
        run: python3 -m pytest tests/ -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck app and frontend/api
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Verify design tokens
        working-directory: frontend
        # Hits propsmadness.com to diff Tailwind tokens; a network hiccup here
        # is noise, not a real regression, so don't fail the whole run on it.
        continue-on-error: true
        run: python3 scripts/verify_design_tokens.py

      - name: Verify similar-players recall
        working-directory: frontend
        run: npx vite-node scripts/verify_similar_players.ts
