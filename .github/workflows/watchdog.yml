name: Pipeline watchdog

# Watches the dashboard from outside the VM, so that a dead or deleted host
# cannot also silence its own alarm. See backend/scripts/watchdog_check.py for
# what is checked and why.
#
# Runs on GitHub's schedule, which is best-effort. Measured 2026-11-23: the twelve
# most recent runs span 77 hours, i.e. roughly one every 6-7 hours, so the great
# majority of */30 ticks are dropped outright rather than merely delayed. Size any
# threshold against that cadence, not against 30 minutes -- and do not expect
# detection sooner than a few hours from this workflow alone.
#
# NOTE: GitHub disables scheduled workflows in repositories with no activity
# for 60 days. During the offseason, either push something occasionally or
# re-enable this from the Actions tab before the season starts.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: 'Override the staleness threshold, in minutes'
        required: false
        default: '90'

# Never let a slow run collide with the next tick.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level so the Alert Discord step's `if: env.WEBHOOK != ''` is reading a value
    # that is certainly in scope. Declared on that step itself, the condition is
    # evaluated against step env, which is the kind of subtlety nobody should have to
    # reason about mid-incident.
    env:
      WEBHOOK: ${{ secrets.WATCHDOG_DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      # No setup-python and no pip install, on purpose. The check uses only the
      # standard library and the runner already ships Python 3, so the watchdog
      # has the fewest possible moving parts that could break it years from now.
      - name: Run health check
        id: check
        env:
          WATCHDOG_STALE_MINUTES: ${{ github.event.inputs.stale_minutes || '90' }}
        # shell: bash is load-bearing, not style. The default `bash -e` has no
        # pipefail, so this pipeline exited with tee's status and the check's own exit
        # code was thrown away -- see this commit's message.
        shell: bash
        run: python3 backend/scripts/watchdog_check.py | tee "$RUNNER_TEMP/report.txt"

      - name: Write run summary
        if: always()
        run: |
          {
            echo '### Pipeline watchdog'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt" 2>/dev/null || echo 'check produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert Discord
        if: failure() && env.WEBHOOK != ''
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq ships on ubuntu-latest and is used here so the message is always
          # valid JSON no matter what characters the summary contains.
          jq -n \
            --arg summary "${SUMMARY:-the health check failed; see the run log}" \
            --arg url "$RUN_URL" \
            '{content: ("**NBA pipeline watchdog**\n" + $summary + "\n" + $url)}' \
            > payload.json
          curl -sS -X POST -H 'content-type: application/json' \
            --data @payload.json "$WEBHOOK" \
            --retry 3 --retry-delay 5 --max-time 30
